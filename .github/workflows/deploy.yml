name: 🚀 Deploy Website to Hostinger via SFTP

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sftp-deploy:
    name: 🌐 Upload Files to Hostinger via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Upload Files to Server via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME || secrets.FTP_USERNAME }}
          server: ${{ secrets.SFTP_SERVER || secrets.FTP_SERVER }}
          password: ${{ secrets.SFTP_PASSWORD || secrets.FTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || secrets.FTP_PORT || 22 }}
          local_path: './*'
          remote_path: '/home/u627514535/domains/rosybrown-woodcock-359682.hostingersite.com/public_html/'
          sftp_args: '-o ConnectTimeout=60'
